name: MediSphere AI CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
        working-directory: apps/api
      - run: pytest tests -q
        working-directory: apps/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build
      - run: for attempt in $(seq 1 60); do curl --fail --silent http://localhost:3000/login >/dev/null && exit 0; sleep 2; done; docker compose logs; exit 1
      - run: npx playwright test
      - if: always()
        run: docker compose down -v
  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build db api
      - run: docker compose --profile performance run --rm k6
      - if: always()
        run: docker compose down -v
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [api, web, end-to-end, performance-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}-api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}-web:${{ github.ref_name }}
