apiVersion: batch/v1
kind: Job
metadata:
  name: medisphere-db-migrate
  namespace: medisphere
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/YOUR_ORG/medisphere-api:VERSION
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ secretRef: { name: medisphere-api-secrets } }]
          env: [{ name: ENVIRONMENT, value: production }]
