apiVersion: batch/v1
kind: Job
metadata:
  name: medisphere-admin-provision
  namespace: medisphere
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: provision
          image: ghcr.io/YOUR_ORG/medisphere-api:VERSION
          command: ["python", "-m", "app.provision_admin"]
          envFrom: [{ secretRef: { name: medisphere-bootstrap-secrets } }]
          env: [{ name: ENVIRONMENT, value: production }]
