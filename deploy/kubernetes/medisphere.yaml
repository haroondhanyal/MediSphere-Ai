apiVersion: v1
kind: Namespace
metadata:
  name: medisphere
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: medisphere
spec:
  replicas: 2
  selector:
    matchLabels: { app: medisphere-api }
  template:
    metadata:
      labels: { app: medisphere-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/medisphere-api:VERSION
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ secretRef: { name: medisphere-api-secrets } }]
          env: [{ name: ENVIRONMENT, value: production }, { name: COOKIE_SECURE, value: "true" }, { name: WEB_BASE_URL, value: "https://medisphere.example.com" }, { name: SEED_DEMO_DATA, value: "false" }, { name: RUN_MIGRATIONS, value: "false" }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: medisphere
  annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8000" }
spec:
  selector: { app: medisphere-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: medisphere
spec:
  replicas: 2
  selector:
    matchLabels: { app: medisphere-web }
  template:
    metadata:
      labels: { app: medisphere-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/YOUR_ORG/medisphere-web:VERSION
          ports: [{ name: http, containerPort: 3000 }]
          env: [{ name: API_INTERNAL_URL, value: http://api:8000 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: medisphere
spec:
  selector: { app: medisphere-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: medisphere
  annotations: { nginx.ingress.kubernetes.io/proxy-read-timeout: "60" }
spec:
  ingressClassName: nginx
  tls:
    - hosts: [medisphere.example.com]
      secretName: medisphere-tls
  rules:
    - host: medisphere.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 3000 } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: medisphere
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: medisphere
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
